name: HACS

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Deliberately not pinned: the HACS checks have to follow current HACS rules,
      # and they run with read-only permissions and no secrets.
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
