name: Ruff

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: Lint and format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Run ruff check
        uses: astral-sh/ruff-action@v4
        with:
          args: check --output-format=github

      - name: Run ruff format
        uses: astral-sh/ruff-action@v4
        with:
          args: format --check --diff
